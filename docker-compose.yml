services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: tuneOps_app

    volumes:
      - ./:/app

    working_dir: /app

    stdin_open: true
    tty: true

    ports:
      - '8000:8000'

    depends_on:
      - redis

  redis:
    image: redis:7

    container_name: tuneOps_redis

    ports:
      - '6379:6379'
